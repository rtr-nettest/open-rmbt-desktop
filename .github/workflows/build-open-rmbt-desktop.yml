name: Build apps

on:
    push:

# Version of the native Rust measurement client (open-rmbt-client-cli release)
# bundled into the app. Downloaded per-platform via the public release URL.
env:
    RUST_CLIENT_VERSION: v2.3.1

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/.env.jj2
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test

    build-linux:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/.env.jj2
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (linux-x64)
              run: |
                  mkdir -p src/measurement/rust_client
                  curl -fsSL -o rust-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${RUST_CLIENT_VERSION}/rmbt-client-rust-linux-x64.zip"
                  unzip -o rust-client.zip -d src/measurement/rust_client
                  chmod +x src/measurement/rust_client/rmbt-client
            - name: Download C measurement client (linux-x64)
              run: |
                  mkdir -p src/measurement/c_client
                  curl -fsSL -o c-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${RUST_CLIENT_VERSION}/rmbt-client-c-linux-x64.zip"
                  unzip -o c-client.zip -d src/measurement/c_client
                  chmod +x src/measurement/c_client/rmbt-client
            - name: Build
              run: |
                  sudo apt-get install -y rpm
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:deb
                  npm run make:rpm
            - uses: actions/upload-artifact@v4
              with:
                  name: application-rpm
                  path: out/make/rpm/x64/*.rpm
            - uses: actions/upload-artifact@v4
              with:
                  name: application-deb
                  path: out/make/deb/x64/*.deb

    build-macos:
        needs: test
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/.env.jj2
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (macos-arm64)
              run: |
                  mkdir -p src/measurement/rust_client
                  curl -fsSL -o rust-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${RUST_CLIENT_VERSION}/rmbt-client-rust-macos-arm64.zip"
                  unzip -o rust-client.zip -d src/measurement/rust_client
                  chmod +x src/measurement/rust_client/rmbt-client
            - name: Download C measurement client (macos-arm64)
              run: |
                  mkdir -p src/measurement/c_client
                  curl -fsSL -o c-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${RUST_CLIENT_VERSION}/rmbt-client-c-macos-arm64.zip"
                  unzip -o c-client.zip -d src/measurement/c_client
                  chmod +x src/measurement/c_client/rmbt-client
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run package
            - uses: actions/upload-artifact@v4
              with:
                  name: application-dmg
                  path: out/**

    build-win:
        needs: test
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/.env.jj2
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-x64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:RUST_CLIENT_VERSION/rmbt-client-rust-windows-x64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-zip
                  path: out/RTR-Netztest-win32-x64/
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-setup
                  path: out/make/squirrel.windows/x64/*.exe

    build-win-arm64:
        needs: test
        runs-on: windows-11-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/.env.jj2
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-arm64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:RUST_CLIENT_VERSION/rmbt-client-rust-windows-arm64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows-arm64
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-arm64-zip
                  path: out/RTR-Netztest-win32-arm64/
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-arm64-setup
                  path: out/make/squirrel.windows/arm64/*.exe

    create_release:
        runs-on: ubuntu-latest
        needs: [build-win, build-win-arm64, build-linux, build-macos]
        steps:
            - name: Download Windows Artifacts-ZIP
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-zip
                  path: windows-zip

            - name: Download Windows Artifacts-Setup
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-setup
                  path: windows-setup

            - name: Download Windows arm64 Artifacts-ZIP
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-arm64-zip
                  path: windows-arm64-zip

            - name: Download Windows arm64 Artifacts-Setup
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-arm64-setup
                  path: windows-arm64-setup

            - name: Download Linux Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-rpm
                  path: linux

            - name: Download Linux Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-deb
                  path: linux

            - name: Download macos Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-dmg
                  path: macos

            - name: Prepare files
              run: |
                  echo "Listing files in linux"
                  ls -R linux
                  cd linux
                  mv *.deb ../RTR-Netztest-linux-x86.deb
                  mv *.rpm ../RTR-Netztest-linux-x86.rpm
                  echo "Listing files in windows-setup"
                  cd ..
                  ls -R windows-setup
                  cd windows-setup
                  mv *.exe ../RTR-Netztest-windows-x86-Setup.exe
                  cd ..
                  echo "Listing files in windows-zip"
                  ls windows-zip
                  zip -r RTR-Netztest-windows-x86.zip windows-zip
                  echo "Listing files in windows-arm64-setup"
                  ls -R windows-arm64-setup
                  cd windows-arm64-setup
                  mv *.exe ../RTR-Netztest-windows-arm64-Setup.exe
                  cd ..
                  echo "Listing files in windows-arm64-zip"
                  ls windows-arm64-zip
                  zip -r RTR-Netztest-windows-arm64.zip windows-arm64-zip
                  echo "Listing files in macos"
                  ls -R macos
                  # macos/RTR-Netztest-darwin-arm64/RTR-Netztest.app
                  cd macos/RTR-Netztest-darwin-arm64
                  zip -r ../../RTR-Netztest-macos.zip RTR-Netztest.app
                  cd ../..
                  ls -l

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              if: github.ref_type == 'tag'
              with:
                  files: |
                      RTR-Netztest-linux-x86.deb
                      RTR-Netztest-linux-x86.rpm
                      RTR-Netztest-macos.zip
                      RTR-Netztest-windows-x86-Setup.exe
                      RTR-Netztest-windows-x86.zip
                      RTR-Netztest-windows-arm64-Setup.exe
                      RTR-Netztest-windows-arm64.zip
                  token: ${{ secrets.GITHUB_TOKEN }}
