<app-header></app-header>
<app-body>
    <app-main-menu></app-main-menu>
    @if (env$ | async; as env) {
        <app-main-content>
            <app-alert
                text="Tests are conducted repeatedly until they are stopped manually"
            >
            </app-alert>
            <div class="app-wrapper" *localize="let t">
                @if (form) {
                    <form [formGroup]="form" (ngSubmit)="onSubmit()">
                        <div>
                            <span>{{ t("Interval between tests") }}</span>
                            <mat-form-field
                                style="width: 88px"
                                appearance="outline"
                            >
                                <input
                                    type="number"
                                    formControlName="interval"
                                    name="interval"
                                    matInput
                                    placeholder=""
                                    required
                                    (click)="onFocus($event)"
                                />
                            </mat-form-field>
                            <span>{{ t("minutes") }}</span>
                        </div>
                        @if (form.controls.interval.invalid) {
                            <mat-error>
                                {{
                                    t(
                                        "The interval must be between %0 and %1 minutes"
                                    ) | sprintf: min : max
                                }}
                            </mat-error>
                        }
                        <div class="app-btn-container">
                            <button
                                type="submit"
                                mat-flat-button
                                color="primary"
                                [disabled]="form.controls.interval.invalid"
                            >
                                {{ t("Start loop test") }}
                            </button>
                        </div>
                    </form>
                }
            </div>
        </app-main-content>
    }
    <app-footer></app-footer>
</app-body>
