@if (menu$ | async; as menu) {
    <ul class="app-list">
        @for (item of menu; track trackBy($index, item)) {
            @if (!item.hidden) {
                <li class="app-list-item">
                    <app-main-menu-item
                        [item]="item"
                        (menuClick)="handleClick($event, item)"
                    ></app-main-menu-item>
                </li>
            }
        }
    </ul>
}
