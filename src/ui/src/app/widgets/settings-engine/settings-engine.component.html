@if (vm$ | async; as vm) {
    <mat-radio-group
        class="app-engine-group"
        [ngModel]="vm.selected"
        (ngModelChange)="change($event)"
    >
        @for (engine of vm.engines; track engine.id) {
            <mat-radio-button class="app-engine-option" [value]="engine.id">
                {{ engine.name }}
            </mat-radio-button>
        }
    </mat-radio-group>
}
