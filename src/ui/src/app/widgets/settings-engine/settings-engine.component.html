@if (selectedEngineId$ | async; as selectedId) {
    <mat-radio-group
        class="app-engine-group"
        [ngModel]="selectedId"
        (ngModelChange)="change($event)"
    >
        @for (engine of engines; track engine.id) {
            <mat-radio-button class="app-engine-option" [value]="engine.id">
                {{ engine.name }}
            </mat-radio-button>
        }
    </mat-radio-group>
}
