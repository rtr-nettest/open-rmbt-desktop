@if (text) {
    <div class="app-alert app-alert--{{ kind }}">
        <div class="app-wrapper">
            @if (kind === "info") {
                <i class="app-icon app-icon--info"></i>
            }
            <span *localize="let t">
                {{ t(text) }}
            </span>
        </div>
        <ng-content></ng-content>
    </div>
}
