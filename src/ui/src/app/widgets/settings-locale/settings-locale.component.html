<mat-select
    disableOptionCentering
    [(ngModel)]="selectedLocale"
    (selectionChange)="change($event)"
>
    <mat-select-trigger>
        {{ selectedLocale?.name }}
    </mat-select-trigger>
    @for (locale of locales; track locale) {
        <mat-option [value]="locale">
            <div class="app-language-name">
                {{ locale.name }}
            </div>
        </mat-option>
    }
</mat-select>
