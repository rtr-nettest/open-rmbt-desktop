<div class="app-wrapper">
    <ng-container *localize="let t">
        @if (title) {
            <h4 class="app-title">{{ t(title) }}</h4>
        }
        @if (list) {
            <ul class="app-list">
                @for (item of list; track item) {
                    <li class="app-list-item" [innerHtml]="item"></li>
                }
            </ul>
        }
    </ng-container>
</div>
