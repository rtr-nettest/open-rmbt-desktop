<app-header></app-header>
<app-body>
    <app-main-menu></app-main-menu>
    @if (env$ | async; as env) {
        <app-main-content>
            @if (showProgress) {
                <div style="width: 100%">
                    <mat-spinner style="margin: auto"></mat-spinner>
                </div>
            }
            @if (!showProgress) {
                <div class="app-wrapper" *localize="let t">
                    <app-start-test-button></app-start-test-button>
                    <div class="app-link-wrapper app-link-wrapper--metrics">
                        <app-home-metrics
                            [list]="ipInfo$ | async"
                            title="Your IP address"
                        ></app-home-metrics>
                        @if (env?.ENABLE_HOME_SCREEN_JITTER_BOX === true) {
                            <app-home-metrics
                                [list]="jitterInfo$ | async"
                            ></app-home-metrics>
                        }
                    </div>
                </div>
            }
        </app-main-content>
    }
    <app-footer></app-footer>
</app-body>
