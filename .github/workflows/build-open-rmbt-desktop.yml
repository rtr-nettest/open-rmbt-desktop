name: Build apps

on:
    push:

# Version of the bundled measurement engines — the Rust, C and Java clients all
# come from this single open-rmbt-client-cli release, downloaded per-platform
# via the public release URLs.
env:
    MEASUREMENT_ENGINE_VERSION: v2.5.2

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test

    build-linux:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (linux-x64)
              run: |
                  mkdir -p src/measurement/rust_client
                  curl -fsSL -o rust-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${MEASUREMENT_ENGINE_VERSION}/rmbt-client-rust-linux-x64.zip"
                  unzip -o rust-client.zip -d src/measurement/rust_client
                  chmod +x src/measurement/rust_client/rmbt-client
            - name: Download C measurement client (linux-x64)
              run: |
                  mkdir -p src/measurement/c_client
                  curl -fsSL -o c-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${MEASUREMENT_ENGINE_VERSION}/rmbt-client-c-linux-x64.zip"
                  unzip -o c-client.zip -d src/measurement/c_client
                  chmod +x src/measurement/c_client/rmbt-client
            - name: Download Java measurement client (linux-x64, bundled JRE)
              run: |
                  mkdir -p src/measurement/java_client
                  curl -fsSL -o java-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${MEASUREMENT_ENGINE_VERSION}/rmbt-client-java-linux-x64.zip"
                  unzip -o java-client.zip -d src/measurement/java_client
                  chmod -R +x src/measurement/java_client/bin || true
            - name: Set up Flatpak toolchain
              run: |
                  sudo apt-get update
                  # elfutils provides eu-strip (required by the maker). zypak is
                  # not built here (see forge.config.js modules:[]) — it comes
                  # from the Electron base app — so no clang is needed.
                  sudo apt-get install -y flatpak flatpak-builder elfutils
                  flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
                  flatpak install --user -y flathub \
                      org.freedesktop.Platform//26.08 \
                      org.freedesktop.Sdk//26.08 \
                      org.electronjs.Electron2.BaseApp//26.08
                  echo "::group::Flatpak versions and installed runtimes"
                  flatpak --version
                  flatpak-builder --version
                  flatpak list
                  echo "::endgroup::"
            - name: Build
              run: |
                  sudo apt-get install -y rpm
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:deb
                  npm run make:rpm
            - name: Build Flatpak
              # DEBUG surfaces flatpak-builder stdout/stderr — @malept/flatpak-bundler
              # routes it through the `debug` logger under its own package namespace,
              # so without this the real error is swallowed (only the exit code shows).
              env:
                  DEBUG: "@malept/flatpak-bundler"
              run: npm run make:flatpak
            - uses: actions/upload-artifact@v4
              with:
                  name: application-rpm
                  path: out/make/rpm/x64/*.rpm
            - uses: actions/upload-artifact@v4
              with:
                  name: application-flatpak
                  path: out/make/flatpak/x86_64/*.flatpak
            - uses: actions/upload-artifact@v4
              with:
                  name: application-deb
                  path: out/make/deb/x64/*.deb

    build-macos:
        needs: test
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token $REPO_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (macos-arm64)
              run: |
                  mkdir -p src/measurement/rust_client
                  curl -fsSL -o rust-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${MEASUREMENT_ENGINE_VERSION}/rmbt-client-rust-macos-arm64.zip"
                  unzip -o rust-client.zip -d src/measurement/rust_client
                  chmod +x src/measurement/rust_client/rmbt-client
            - name: Download Java measurement client (macos-arm64, bundled JRE)
              run: |
                  mkdir -p src/measurement/java_client
                  curl -fsSL -o java-client.zip "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/${MEASUREMENT_ENGINE_VERSION}/rmbt-client-java-macos-arm64.zip"
                  unzip -o java-client.zip -d src/measurement/java_client
                  chmod +x "src/measurement/java_client/rmbt-client.app/Contents/MacOS/rmbt-client" || true
            # The C client is intentionally NOT bundled on macOS: its published
            # macOS binary is dynamically linked against Homebrew libcurl/openssl
            # and cannot run on end-user Macs. Rust (default) / JS are used there.
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run package
            - uses: actions/upload-artifact@v4
              with:
                  name: application-dmg
                  path: out/**

    build-win:
        needs: test
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-x64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-rust-windows-x64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
                  # Ship the MSVC runtime next to rmbt-client.exe so the Rust
                  # client runs on machines without the VC++ Redistributable
                  # (app-local deployment; Windows searches the exe's own
                  # directory first). vcruntime140_1.dll is x64-only, so copy
                  # whichever DLLs exist on the runner.
                  foreach ($dll in "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll") {
                      $src = Join-Path $env:SystemRoot "System32\$dll"
                      if (Test-Path $src) { Copy-Item $src src/measurement/rust_client/ -Force }
                  }
            - name: Download Java measurement client (windows-x64, bundled JRE)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/java_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-java-windows-x64.zip" -OutFile java-client.zip
                  Expand-Archive -Path java-client.zip -DestinationPath src/measurement/java_client -Force
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-zip
                  path: out/RTR-Netztest-win32-x64/
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-setup
                  path: out/make/squirrel.windows/x64/*.exe

    build-win-arm64:
        needs: test
        runs-on: windows-11-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-arm64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-rust-windows-arm64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
            - name: Download Java measurement client (windows-arm64, bundled JRE)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/java_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-java-windows-arm64.zip" -OutFile java-client.zip
                  Expand-Archive -Path java-client.zip -DestinationPath src/measurement/java_client -Force
            - name: Build
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows-arm64
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-arm64-zip
                  path: out/RTR-Netztest-win32-arm64/
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-arm64-setup
                  path: out/make/squirrel.windows/arm64/*.exe

    # Microsoft Store (MSIX) builds. Separate from the Squirrel .exe jobs above
    # (gated by WIN_STORE=true in forge.config.js) and intentionally ship only
    # the Rust engine + the built-in JavaScript fallback — no Java/C client is
    # downloaded here. The package is signed with an ephemeral self-signed cert
    # (the Store re-signs on ingestion, so no commercial certificate is needed).
    # Identity (MSIX_PACKAGE_NAME / MSIX_PUBLISHER) comes from prod.env.
    build-win-msix:
        needs: test
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-x64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-rust-windows-x64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
                  foreach ($dll in "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll") {
                      $src = Join-Path $env:SystemRoot "System32\$dll"
                      if (Test-Path $src) { Copy-Item $src src/measurement/rust_client/ -Force }
                  }
            - name: Prepare MSIX signing cert and SDK path
              shell: pwsh
              run: |
                  # Publisher identity from prod.env (Partner Center value, e.g. "CN=<GUID>").
                  $line = (Select-String -Path .env -Pattern '^\s*MSIX_PUBLISHER\s*=' | Select-Object -First 1).Line
                  $publisher = ($line -replace '^\s*MSIX_PUBLISHER\s*=','').Trim().Trim('"')
                  if (-not $publisher) { throw "MSIX_PUBLISHER is not set in prod.env" }
                  # Ephemeral self-signed cert matching the publisher; the Store re-signs.
                  $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
                  $pfx = Join-Path $env:RUNNER_TEMP "msix-dev.pfx"
                  Export-PfxCertificate -Cert ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -FilePath $pfx -Password (ConvertTo-SecureString -String "rmbt-msix-ci" -Force -AsPlainText) | Out-Null
                  # Newest Windows SDK bin that has makeappx.exe (x64 tools).
                  $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } | Sort-Object Name -Descending | Select-Object -First 1
                  "MSIX_CERT_PATH=$pfx"            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "MSIX_CERT_PASS=rmbt-msix-ci"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "WINDOWS_KITS_PATH=$($kit.FullName)\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            - name: Build MSIX
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows-store
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-msix
                  path: out/make/appx/x64/*.msix

    build-win-msix-arm64:
        needs: test
        runs-on: windows-11-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history and tags (version from git tag)
            - name: Get .env
              shell: cmd
              env:
                  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
              run: |
                  curl -H "Authorization: token %REPO_TOKEN%" -H "Accept: application/vnd.github.v3.raw" -o .env -L https://api.github.com/repos/rtr-nettest/open-rmbt-desktop-private/contents/prod.env
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
            - name: Download Rust measurement client (windows-arm64)
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force src/measurement/rust_client | Out-Null
                  Invoke-WebRequest -Uri "https://github.com/rtr-nettest/open-rmbt-client-cli/releases/download/$env:MEASUREMENT_ENGINE_VERSION/rmbt-client-rust-windows-arm64.zip" -OutFile rust-client.zip
                  Expand-Archive -Path rust-client.zip -DestinationPath src/measurement/rust_client -Force
            - name: Prepare MSIX signing cert and SDK path
              shell: pwsh
              run: |
                  $line = (Select-String -Path .env -Pattern '^\s*MSIX_PUBLISHER\s*=' | Select-Object -First 1).Line
                  $publisher = ($line -replace '^\s*MSIX_PUBLISHER\s*=','').Trim().Trim('"')
                  if (-not $publisher) { throw "MSIX_PUBLISHER is not set in prod.env" }
                  $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
                  $pfx = Join-Path $env:RUNNER_TEMP "msix-dev.pfx"
                  Export-PfxCertificate -Cert ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -FilePath $pfx -Password (ConvertTo-SecureString -String "rmbt-msix-ci" -Force -AsPlainText) | Out-Null
                  # Prefer arm64 SDK tools, fall back to x64 (x64 runs under emulation).
                  $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object { (Test-Path (Join-Path $_.FullName 'arm64\makeappx.exe')) -or (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) } | Sort-Object Name -Descending | Select-Object -First 1
                  $sub = if (Test-Path (Join-Path $kit.FullName 'arm64\makeappx.exe')) { 'arm64' } else { 'x64' }
                  "MSIX_CERT_PATH=$pfx"            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "MSIX_CERT_PASS=rmbt-msix-ci"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "WINDOWS_KITS_PATH=$($kit.FullName)\$sub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            - name: Build MSIX
              run: |
                  npm install
                  cd src/ui
                  npm install
                  cd ../..
                  npm run make:windows-store-arm64
            - uses: actions/upload-artifact@v4
              with:
                  name: application-windows-msix-arm64
                  path: out/make/appx/arm64/*.msix

    create_release:
        runs-on: ubuntu-latest
        needs:
            [
                build-win,
                build-win-arm64,
                build-win-msix,
                build-win-msix-arm64,
                build-linux,
                build-macos,
            ]
        steps:
            - name: Download Windows Artifacts-ZIP
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-zip
                  path: windows-zip

            - name: Download Windows Artifacts-Setup
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-setup
                  path: windows-setup

            - name: Download Windows arm64 Artifacts-ZIP
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-arm64-zip
                  path: windows-arm64-zip

            - name: Download Windows arm64 Artifacts-Setup
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-arm64-setup
                  path: windows-arm64-setup

            - name: Download Windows MSIX Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-msix
                  path: windows-msix

            - name: Download Windows arm64 MSIX Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-windows-msix-arm64
                  path: windows-msix-arm64

            - name: Download Linux Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-rpm
                  path: linux

            - name: Download Linux Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-deb
                  path: linux

            - name: Download Linux Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-flatpak
                  path: linux

            - name: Download macos Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: application-dmg
                  path: macos

            - name: Prepare files
              run: |
                  echo "Listing files in linux"
                  ls -R linux
                  cd linux
                  mv *.deb ../RTR-Netztest-linux-x86.deb
                  mv *.rpm ../RTR-Netztest-linux-x86.rpm
                  mv *.flatpak ../RTR-Netztest-linux-x86.flatpak
                  echo "Listing files in windows-setup"
                  cd ..
                  ls -R windows-setup
                  cd windows-setup
                  mv *.exe ../RTR-Netztest-windows-x86-Setup.exe
                  cd ..
                  echo "Listing files in windows-zip"
                  ls windows-zip
                  zip -r RTR-Netztest-windows-x86.zip windows-zip
                  echo "Listing files in windows-arm64-setup"
                  ls -R windows-arm64-setup
                  cd windows-arm64-setup
                  mv *.exe ../RTR-Netztest-windows-arm64-Setup.exe
                  cd ..
                  echo "Listing files in windows-arm64-zip"
                  ls windows-arm64-zip
                  zip -r RTR-Netztest-windows-arm64.zip windows-arm64-zip
                  echo "Listing files in windows-msix"
                  ls -R windows-msix
                  mv windows-msix/*.msix RTR-Netztest-windows-x86.msix
                  echo "Listing files in windows-msix-arm64"
                  ls -R windows-msix-arm64
                  mv windows-msix-arm64/*.msix RTR-Netztest-windows-arm64.msix
                  echo "Listing files in macos"
                  ls -R macos
                  # macos/RTR-Netztest-darwin-arm64/RTR-Netztest.app
                  cd macos/RTR-Netztest-darwin-arm64
                  zip -r ../../RTR-Netztest-macos.zip RTR-Netztest.app
                  cd ../..
                  ls -l

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              if: github.ref_type == 'tag'
              with:
                  files: |
                      RTR-Netztest-linux-x86.deb
                      RTR-Netztest-linux-x86.rpm
                      RTR-Netztest-linux-x86.flatpak
                      RTR-Netztest-macos.zip
                      RTR-Netztest-windows-x86-Setup.exe
                      RTR-Netztest-windows-x86.zip
                      RTR-Netztest-windows-arm64-Setup.exe
                      RTR-Netztest-windows-arm64.zip
                      RTR-Netztest-windows-x86.msix
                      RTR-Netztest-windows-arm64.msix
                  token: ${{ secrets.GITHUB_TOKEN }}
